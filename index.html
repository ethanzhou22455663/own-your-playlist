<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Own Your Playlist - Music Tag Editor</title>
  <style>
    /* =========================================================
       设计系统：Apple 极简主义 + 深色模式
       ========================================================= */
    :root {
      --bg-primary: #000000;
      --bg-secondary: #121212;
      --bg-tertiary: #1c1c1e;
      --bg-elevated: #2c2c2e;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.64);
      --text-tertiary: rgba(255, 255, 255, 0.40);
      --accent: #e0e0e0;
      --accent-hover: #ffffff;
      --border: rgba(255, 255, 255, 0.08);
      --hover: rgba(255, 255, 255, 0.06);
      --selected: rgba(255, 255, 255, 0.10);
      --selected-hover: rgba(255, 255, 255, 0.16);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --radius-xl: 999px;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --space-xl: 20px;
      --space-2xl: 28px;
      --space-3xl: 40px;
      --sidebar-width: 240px;
      --panel-width: 50vw;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.4;
      letter-spacing: -0.01em;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-xl);
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.22);
      background-clip: padding-box;
    }

    /* =========================================================
       整体布局：侧边栏 + 主内容
       ========================================================= */
    .app {
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      height: 100vh;
      width: 100vw;
    }

    /* =========================================================
       左侧边栏
       ========================================================= */
    .sidebar {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: var(--space-2xl) var(--space-lg);
      gap: var(--space-2xl);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      font-size: 17px;
      font-weight: 700;
      padding-left: var(--space-sm);
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      background: var(--accent);
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      font-size: 14px;
      color: var(--bg-primary);
    }

    .nav-section {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .nav-section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0 var(--space-md);
      margin-bottom: var(--space-xs);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: 9px var(--space-md);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.12s ease;
      font-weight: 500;
    }

    .nav-item:hover {
      background: var(--hover);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .nav-item .icon {
      width: 20px;
      text-align: center;
      font-size: 14px;
    }

    /* =========================================================
       主内容区
       ========================================================= */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .main-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* 顶部标题区 */
    .header {
      padding: var(--space-3xl) var(--space-2xl) var(--space-xl);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .header-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-meta {
      color: var(--text-secondary);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    /* 工具栏 */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-sm) var(--space-2xl) var(--space-lg);
      border-bottom: 1px solid var(--border);
      gap: var(--space-md);
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    /* 工具栏内紧挨着的元素组，用于缩小"未选择"和"编辑"按钮之间的间距 */
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 12px;  /* 未选择和编辑按钮之间的间距 */
    }

    .selection-info {
      color: var(--text-secondary);
      font-size: 13px;
      width: auto;         /* 随文字内容宽度变化 */
      flex-shrink: 0;      /* 在 flex 容器里不被压缩 */
      white-space: nowrap; /* 文字不换行 */
    }

    .btn {
      padding: 5px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      line-height: 1;          /* 让文字行高和字号一致，避免撑高按钮 */
      cursor: pointer;
      transition: all 0.12s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center; /* 文字在按钮内水平居中 */
      gap: 6px;
    }

    .btn:hover {
      background: var(--bg-elevated);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg-primary);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* 歌曲搜索框：下划线细线样式，宽度贴合内容 */
    .search-input {
      padding: 6px 0;
      border: none;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      line-height: 1;
      width: auto;           /* 宽度由 size 属性和内容决定 */
      transition: border-color 0.12s ease;
    }

    .search-input::placeholder {
      color: var(--text-tertiary);
    }

    .search-input:focus {
      outline: none;
      border-bottom-color: var(--accent);
      background: transparent;
    }

    /* 路径输入框：下划线细线样式，宽度贴合内容 */
    .path-input {
      padding: 6px 0;
      border: none;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-family: inherit;
      line-height: 1;
      width: auto;           /* 宽度由 size 属性和内容决定 */
      transition: border-color 0.12s ease;
    }

    .path-input:focus {
      outline: none;
      border-bottom-color: var(--accent);
      color: var(--text-primary);
      background: transparent;
    }

    /* 统一按钮和输入框的高度，避免视觉不齐 */
    .btn,
    .search-input,
    .path-input {
      height: 28px;
    }

    /* =========================================================
       歌曲列表
       ========================================================= */
    .tracklist-container {
      flex: 1;
      overflow: auto;
    }

    .tracklist {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .tracklist th {
      text-align: left;
      padding: 10px var(--space-sm);
      color: var(--text-tertiary);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg-primary);
      z-index: 5;
      white-space: nowrap;
    }

    .tracklist th:first-child {
      padding-left: var(--space-lg);
      width: 44px;
    }

    .tracklist th:nth-child(2) {
      width: 44px;
    }

    .tracklist th:last-child {
      width: 70px;
      padding-right: var(--space-lg);
    }

    .tracklist td {
      padding: 9px var(--space-sm);
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.1s ease;
    }

    .tracklist tbody tr {
      cursor: pointer;
      transition: background 0.1s ease;
    }

    .tracklist tbody tr:hover {
      background: var(--hover);
    }

    .tracklist tbody tr.selected {
      background: var(--selected);
    }

    .tracklist tbody tr.selected:hover {
      background: var(--selected-hover);
    }

    .tracklist tbody tr.selected td {
      color: var(--text-primary);
    }

    .tracklist tbody tr.dragging {
      opacity: 0.6;
      background: var(--bg-tertiary);
    }

    .tracklist td:first-child {
      padding-left: var(--space-lg);
    }

    .tracklist td:last-child {
      padding-right: var(--space-lg);
      text-align: right;
    }

    .checkbox {
      width: 16px;
      height: 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--text-tertiary);
      background: transparent;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.12s ease;
      color: var(--bg-primary);
      font-size: 10px;
    }

    .checkbox:hover {
      border-color: var(--text-primary);
    }

    .checkbox.checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .track-number {
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .track-title {
      color: var(--text-primary);
      font-weight: 500;
    }

    .track-artist {
      color: var(--text-secondary);
    }

    /* =========================================================
       右侧批量编辑面板
       ========================================================= */
    .edit-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--panel-width);
      height: 100vh;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      z-index: 100;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .edit-panel.open {
      transform: translateX(0);
    }

    .edit-panel-header {
      padding: var(--space-2xl);
      padding-top: var(--space-3xl);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      position: relative;
    }

    .edit-panel-close {
      position: absolute;
      top: var(--space-lg);
      right: var(--space-lg);
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      transition: all 0.12s ease;
    }

    .edit-panel-close:hover {
      background: var(--hover);
      color: var(--text-primary);
    }

    .edit-panel-cover {
      width: 120px;
      height: 120px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #555555 0%, #333333 100%);
      display: grid;
      place-items: center;
      font-size: 48px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.35);
    }

    .edit-panel-title {
      font-size: 20px;
      font-weight: 700;
    }

    .edit-panel-subtitle {
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.5;
    }

    .edit-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-xl);
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .field input {
      padding: 11px var(--space-md);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      transition: all 0.12s ease;
    }

    .field input::placeholder {
      color: var(--text-tertiary);
    }

    .field input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--bg-elevated);
    }

    .field-hint {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    .edit-panel-footer {
      padding: var(--space-xl);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .save-btn {
      width: 100%;
      padding: 11px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--accent);
      color: var(--bg-primary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .save-btn:hover {
      background: var(--accent-hover);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 90;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 左侧边栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">◈</div>
        <span>Own Your Playlist</span>
      </div>

      <nav class="nav-section">
        <div class="nav-section-title">资料库</div>
        <div class="nav-item active">
          <span class="icon">🎵</span>
          <span>歌曲</span>
        </div>
        <div class="nav-item">
          <span class="icon">💿</span>
          <span>专辑</span>
        </div>
        <div class="nav-item">
          <span class="icon">🎤</span>
          <span>歌手</span>
        </div>
      </nav>

      <nav class="nav-section">
        <div class="nav-section-title">管理</div>
        <div class="nav-item">
          <span class="icon">⚙️</span>
          <span>设置</span>
        </div>
      </nav>
    </aside>

    <!-- 主内容 -->
    <main class="main">
      <div class="main-scroll">
        <header class="header">
          <h1 class="header-title">歌曲</h1>
          <div class="header-meta">
            <span id="song-count">3 首歌曲</span>
          </div>
        </header>

        <div class="toolbar">
          <div class="toolbar-left">
            <button class="btn" id="select-all-btn">
              <span class="checkbox" id="select-all-box"></span>
              <span>全选</span>
            </button>
            <div class="toolbar-group">
              <span class="selection-info" id="selection-info">未选择</span>
              <button class="btn" id="edit-btn" disabled>编辑</button>
            </div>
          </div>
          <div class="toolbar-right">
            <input type="text" id="search-input" class="search-input" placeholder="搜索歌曲、歌手、专辑..." size="22">
            <button class="btn" id="search-btn">搜索</button>
            <input type="text" id="music-path" class="path-input" value="./music" title="音乐文件夹路径" size="9">
            <button class="btn" id="browse-path-btn">浏览…</button>
            <button class="btn" id="scan-btn">扫描文件夹</button>
          </div>
        </div>

        <div class="tracklist-container">
          <table class="tracklist">
            <thead>
              <tr>
                <th></th>
                <th>#</th>
                <th>标题</th>
                <th>歌手</th>
                <th>专辑</th>
                <th>风格</th>
                <th>时长</th>
              </tr>
            </thead>
            <tbody id="tracklist-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- 遮罩 -->
  <div class="overlay" id="overlay"></div>

  <!-- 右侧批量编辑面板 -->
  <aside class="edit-panel" id="edit-panel">
    <button class="edit-panel-close" id="edit-panel-close">✕</button>
    <div class="edit-panel-header">
      <div class="edit-panel-cover">✎</div>
      <div class="edit-panel-title" id="panel-title">编辑歌曲</div>
      <div class="edit-panel-subtitle" id="panel-subtitle">选择歌曲以编辑 metadata</div>
    </div>
    <div class="edit-panel-body">
      <div class="field">
        <label>歌名</label>
        <input type="text" id="edit-title" placeholder="留空则不变">
        <div class="field-hint">批量编辑时，只有填写的字段才会被修改</div>
      </div>
      <div class="field">
        <label>歌手</label>
        <input type="text" id="edit-artist" placeholder="留空则不变">
      </div>
      <div class="field">
        <label>专辑</label>
        <input type="text" id="edit-album" placeholder="留空则不变">
      </div>
      <div class="field">
        <label>风格</label>
        <input type="text" id="edit-genre" placeholder="留空则不变">
      </div>
      <div class="field">
        <label>作曲家</label>
        <input type="text" id="edit-composer" placeholder="留空则不变">
      </div>
    </div>
    <div class="edit-panel-footer">
      <button class="save-btn" id="save-btn">保存更改</button>
    </div>
  </aside>
  
    <script>
 // ========== 1. 拿到页面元素 ==========
  const tbody = document.getElementById('tracklist-body');
  const songCount = document.getElementById('song-count');
  const scanBtn = document.getElementById('scan-btn');
  const musicPathInput = document.getElementById('music-path');

  // ========== 2. 数据仓库 ==========
  // allTracks：扫描得到的完整歌曲列表（搜索时的“总仓库”）
  // tracks：当前页面上显示的歌曲列表（可能被搜索过滤）
  let allTracks = [];
  let tracks = [];

  // ========== 3. 小工具函数 ==========

  // 把秒数变成 "4:29" 这种格式
  // 289 秒 → 4 分 49 秒 → "4:49"
  function formatDuration(totalSeconds) {
    if (!totalSeconds || totalSeconds < 0) return '0:00';
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = Math.floor(totalSeconds % 60);
    // padStart(2, '0')：如果秒数只有一位，前面补 0，比如 5 → "05"
    return `${minutes}:${seconds.toString().padStart(2, '0')}`;
  }

  // 把 ["流行", "摇滚"] 变成 "流行, 摇滚"
  // 如果数组为空，返回空字符串，表格里就不显示
  function formatArray(arr) {
    if (!arr || arr.length === 0) return '';
    return arr.join(', ');
  }

   // ========== 4. 渲染函数 ==========
  function renderTracks() {
    // 先清空旧内容
    tbody.innerHTML = '';

    tracks.forEach((track, index) => {
      // 创建一行
      const tr = document.createElement('tr');

      // 用文件路径当唯一 ID，因为真实歌曲没有 "id" 字段
      tr.dataset.id = track.filePath;
      tr.dataset.index = index;

      // 序号用列表里的位置 + 1
      const number = index + 1;

      tr.innerHTML = `
        <td><div class="checkbox"></div></td>
        <td class="track-number">${number}</td>
        <td class="track-title">${track.title}</td>
        <td class="track-artist">${track.artist}</td>
        <td>${track.album}</td>
        <td>${formatArray(track.genre)}</td>
        <td>${formatDuration(track.durationSec)}</td>
      `;

      tbody.appendChild(tr);
    });

    updateSongCount();
  }

  // 更新“3 首歌曲”这个提示文字
  function updateSongCount() {
    songCount.textContent = `${tracks.length} 首歌曲`;
  }

    // ========== 5. 扫描按钮 ==========
    scanBtn.addEventListener('click', async () => {
    const folderPath = musicPathInput.value.trim();

    try {
      // 调用 preload 暴露的接口，把 folderPath 传进主进程
      const scanned = await window.electronAPI.scanMusic(folderPath);

      // 原始结果放进总仓库，也作为当前显示列表
      allTracks = scanned;
      tracks = allTracks;

      renderTracks();
    } catch (err) {
      console.error('扫描失败', err);
      alert('扫描失败：' + err.message);
    }
  });


  </script>
  
</body>
</html>
